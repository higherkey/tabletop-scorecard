name = "tabletop-scorecard"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [
  { pattern = "www.eight1fivedesign.com/tabletop-scorecard", zone_name = "eight1fivedesign.com" },
  { pattern = "www.eight1fivedesign.com/tabletop-scorecard/*", zone_name = "eight1fivedesign.com" }
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[vars]
NEON_AUTH_URL = "https://ep-summer-breeze-bdgam8p2.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth"
